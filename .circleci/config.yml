version: 2.1
parameters:
  publish_toolchain_image:
    type: boolean
    default: false
  build_toolchain_image:
    type: boolean
    default: false
jobs:
  validate-toolchain-image:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and validate reusable cpp-qt6-ubuntu2404 without publishing
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            docker build --pull --progress=plain -t ci-foundry/cpp-qt6-ubuntu2404:candidate ci/images/cpp-builder
            docker run --rm ci-foundry/cpp-qt6-ubuntu2404:candidate sh -c 'cmake --version && g++ --version && pkg-config --modversion Qt6Core'
            docker image inspect ci-foundry/cpp-qt6-ubuntu2404:candidate --format '{{.Id}}'
            echo 'Validated locally; image NOT published or digest-certified.'
  publish-toolchain-image:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build validate and publish private qt6 toolchain image
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            : "${GHCR_USERNAME:?Missing GHCR_USERNAME}"
            : "${GHCR_TOKEN:?Missing GHCR_TOKEN}"
            image="ghcr.io/sudipdasin/linwin-qt6-builder"
            docker build --pull --progress=plain -t "${image}:${CIRCLE_SHA1}" ci/images/cpp-builder
            docker run --rm "${image}:${CIRCLE_SHA1}" sh -c 'cmake --version && g++ --version && pkg-config --modversion Qt6Core'
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker push "${image}:${CIRCLE_SHA1}"
            docker logout ghcr.io
            echo 'Publication completed; verify package is private and capture registry digest before reuse.'

  ubuntu-smoke:
    docker:
      - image: ubuntu:24.04
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Ubuntu Qt6 build dependencies
          command: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ pkg-config libglib2.0-dev qt6-base-dev
      - run:
          name: Compile and test Ubuntu build
          command: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure
workflows:
  manual-toolchain-image-publication:
    when: << pipeline.parameters.publish_toolchain_image >>
    jobs:
      - publish-toolchain-image:
          context: ghcr-publisher
          filters:
            branches:
              only: main
  manual-toolchain-image-validation:
    when: << pipeline.parameters.build_toolchain_image >>
    jobs:
      - validate-toolchain-image:
          filters:
            branches:
              only: main
  ubuntu-ci:
    # CI_MASTER_TOGGLE: managed by scripts/ci-master-toggle.py
    when: false
    jobs:
      - ubuntu-smoke:
          filters:
            branches:
              only: main
