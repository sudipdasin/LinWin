version: 2.1
parameters:
  build_toolchain_image:
    type: boolean
    default: false
jobs:
  validate-toolchain-image:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and validate reusable cpp-qt6-ubuntu2404 without publishing
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            docker build --pull --progress=plain -t ci-foundry/cpp-qt6-ubuntu2404:candidate ci/images/cpp-builder
            docker run --rm ci-foundry/cpp-qt6-ubuntu2404:candidate sh -c 'cmake --version && g++ --version && pkg-config --modversion Qt6Core'
            docker image inspect ci-foundry/cpp-qt6-ubuntu2404:candidate --format '{{.Id}}'
            echo 'Validated locally; image NOT published or digest-certified.'
  ubuntu-smoke:
    docker:
      - image: ubuntu:24.04
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Ubuntu Qt6 build dependencies
          command: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ pkg-config libglib2.0-dev qt6-base-dev
      - run:
          name: Compile and test Ubuntu build
          command: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure
workflows:
  manual-toolchain-image-validation:
    when: << pipeline.parameters.build_toolchain_image >>
    jobs:
      - validate-toolchain-image:
          filters:
            branches:
              only: main
  ubuntu-ci:
    # CI_MASTER_TOGGLE: managed by scripts/ci-master-toggle.py
    when: false
    jobs:
      - ubuntu-smoke:
          filters:
            branches:
              only: main
