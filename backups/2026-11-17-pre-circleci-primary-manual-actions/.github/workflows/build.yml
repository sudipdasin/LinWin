name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  distro-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y cmake g++ pkg-config libglib2.0-dev qt6-base-dev
          - image: debian:13
            install: apt-get update && apt-get install -y cmake g++ pkg-config libglib2.0-dev qt6-base-dev
          - image: fedora:latest
            install: dnf install -y cmake gcc-c++ pkgconf-pkg-config glib2-devel qt6-qtbase-devel
          - image: archlinux:latest
            install: pacman -Syu --noconfirm --needed cmake gcc make pkgconf glib2 qt6-base
    steps:
      - uses: actions/checkout@v4
      - name: Build in ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "${{ matrix.image }}" \
            sh -lc '${{ matrix.install }} && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2 && ctest --test-dir build --output-on-failure'
